services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesapp}
      POSTGRES_DB: ${POSTGRES_DB:-salesapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ../database/migrations/002_discovery_enrichment.sql:/docker-entrypoint-initdb.d/002_discovery_enrichment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesapp} -d ${POSTGRES_DB:-salesapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales-network

  redis:
    image: redis:7-alpine
    container_name: sales-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: sales-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salesapp}:${POSTGRES_PASSWORD:-salesapp}@postgres:5432/${POSTGRES_DB:-salesapp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sales-network

  celery-worker:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: sales-celery-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salesapp}:${POSTGRES_PASSWORD:-salesapp}@postgres:5432/${POSTGRES_DB:-salesapp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A src.jobs.celery_app worker --loglevel=info
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - sales-network

  celery-beat:
    profiles:
      - worker
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: sales-celery-beat
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-salesapp}:${POSTGRES_PASSWORD:-salesapp}@postgres:5432/${POSTGRES_DB:-salesapp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A src.jobs.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sales-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: development
    container_name: sales-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - sales-network

volumes:
  postgres_data:
  redis_data:

networks:
  sales-network:
    driver: bridge
